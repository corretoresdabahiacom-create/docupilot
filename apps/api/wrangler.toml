name = "docupilot-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# postgres.js precisa de sockets TCP/Buffer do runtime Node (chave de nível raiz, antes das tabelas).
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Origens do front-end autorizadas a chamar a API, separadas por vírgula.
ALLOWED_ORIGINS = ""

# Retenção diária (auditoria 180 d, sessões, links expirados, denúncias resolvidas). 04:00 UTC.
[triggers]
crons = ["0 4 * * *"]

# Banco: Postgres no Supabase. NÃO há binding: a connection string do POOLER (porta 6543, modo
# transaction) é um segredo e nunca vai ao repositório:
#   wrangler secret put DATABASE_URL
# Sem ela a API responde 503 SERVICE_NOT_CONFIGURED (exceto /health).

# Armazenamento (R2) fica DESLIGADO até o usuário ativar o R2 na própria conta.
# Depois de ativar, descomente e configure os segredos (nunca no repositório):
#   wrangler secret put R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET_NAME
# [[r2_buckets]]
# binding = "STORAGE_BUCKET"
# bucket_name = "docupilot-files"

# Anti-robô: wrangler secret put TURNSTILE_SECRET
